# =============================================================================
# Qwalora Ranger — the range
#
# Safe by design. The targets are deliberately vulnerable (that is the point);
# the lab AROUND them is hardened so it cannot escape the host, reach the
# internet, or leak:
#   - every network is `internal: true`  -> no route to the internet
#   - every UI port binds to 127.0.0.1   -> never exposed on a public interface
#   - containers run non-root, read-only, cap_drop ALL, no-new-privileges
#   - NO docker socket is ever mounted   -> the usual escape is closed
#   - images are pinned by digest        -> run `qrange pin` to refresh
#
# This is best-practice hardening, not an absolute guarantee. Treat the whole
# lab as hostile and never bridge it to a network you care about.
# =============================================================================

name: qwalora-range

x-hardening: &hardening
  read_only: true
  security_opt:
    - no-new-privileges:true
    - seccomp:./lab/seccomp/default.json
  cap_drop:
    - ALL
  pids_limit: 256
  restart: "no"

networks:
  # Red/target segment. internal:true => NO egress to the internet.
  range_internal:
    internal: true
    driver: bridge
  # Blue/telemetry segment, also internal.
  range_soc:
    internal: true
    driver: bridge

volumes:
  wazuh_data:
  grafana_data:

services:

  # ---- TARGET: intentionally-vulnerable web/API (BOLA / IDOR / SSRF practice)
  target-webapi:
    build: ./lab/targets/web-api
    <<: *hardening
    user: "10001:10001"
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      range_internal:
        aliases: [target, api.target.lab]
    # bound to loopback only, for the ranger's own browser/tools
    ports:
      - "127.0.0.1:7443:8080"
    environment:
      - QW_SCENARIO=board2
    mem_limit: 256m
    cpus: 0.5

  # ---- ATTACKER: offensive tooling, on the internal net, no egress
  attacker:
    build: ./lab/attacker
    <<: *hardening
    # attacker needs a writable home for tool state; scope it to a tmpfs
    read_only: false
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    cap_add: [NET_RAW, NET_ADMIN]   # nmap/scanning only, still no host access
    networks: [range_internal]
    command: ["sleep", "infinity"]
    mem_limit: 512m
    cpus: 1.0

  # ---- SENSOR: Suricata IDS on the internal segment (blue team)
  suricata:
    image: jasonish/suricata:7.0.7@sha256:REPLACE_WITH_PINNED_DIGEST
    network_mode: "service:target-webapi"   # observe the target's traffic
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
    read_only: true
    volumes:
      - ./lab/soc/suricata:/etc/suricata/custom:ro
      - ./detections/suricata:/etc/suricata/rules/qwalora:ro
    security_opt: [no-new-privileges:true]
    mem_limit: 512m

  # ---- SIEM: Wazuh single-node manager (blue team)
  wazuh:
    image: wazuh/wazuh-manager:4.9.2@sha256:REPLACE_WITH_PINNED_DIGEST
    hostname: qw-siem
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [SETGID, SETUID, DAC_OVERRIDE]   # wazuh drops to its own user
    networks: [range_soc, range_internal]
    volumes:
      - wazuh_data:/var/ossec/data
      - ./lab/soc/wazuh/decoders:/var/ossec/etc/decoders/qwalora:ro
    ports:
      - "127.0.0.1:1514:1514/udp"
    mem_limit: 1g
    cpus: 1.0

  # ---- DASHBOARDS: Grafana, loopback-only
  grafana:
    image: grafana/grafana-oss:11.3.0@sha256:REPLACE_WITH_PINNED_DIGEST
    <<: *hardening
    read_only: false
    user: "472:472"
    networks: [range_soc]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./lab/soc/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/gf_admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_SERVER_ROOT_URL=http://127.0.0.1:3000
    ports:
      - "127.0.0.1:3000:3000"
    secrets: [gf_admin]
    mem_limit: 512m

secrets:
  gf_admin:
    file: ./lab/soc/grafana/admin_password   # generated by `qrange up`, gitignored
