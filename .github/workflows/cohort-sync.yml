# =============================================================================
# Cohort sign-off. Program-side. Re-measures every board from scratch (trusting
# no committed report) and signs the result with the cohort's Ed25519 key. The
# signed attestation is what the public Ranger Dossier verifies in the browser,
# so a badge cannot be forged without the program's private key.
#
# Set the repo secret QW_COHORT_PRIVKEY (base64 of a 32-byte Ed25519 seed).
# Generate one with:  python3 scripts/gen_cohort_key.py
# =============================================================================
name: cohort-sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"   # Mondays, 06:17 UTC

permissions:
  contents: write

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet pyyaml cryptography

      - name: Re-measure and sign
        env:
          QW_COHORT_PRIVKEY: ${{ secrets.QW_COHORT_PRIVKEY }}
          QW_CANDIDATE: ${{ github.repository_owner }}
        run: python3 scripts/sign_attestation.py

      - name: Commit the signed attestation
        run: |
          git config user.name  "qwalora-cohort-bot"
          git config user.email "cohort@qwalora.com"
          git add evidence/attestation.json cohort-pubkey.b64
          git diff --cached --quiet || git commit -m "cohort: signed attestation [skip ci]"
          git push
