# Template integrity smoke-check. The job is named `grade` so the branch
# ruleset's required check is satisfied. It reads NO secrets and NO answer keys:
# authoritative, answer-free grading is done program-side at cohort sync.
name: validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Smoke-check the lab template
        run: python3 scripts/selfcheck.py
