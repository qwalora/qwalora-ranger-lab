# =============================================================================
# Board 2 - Broken Object Level Authorization (BOLA / IDOR)
# ATT&CK: T1190 Exploit Public-Facing Application
#
# A board is graded by the checks below. validate.py runs them with zero manual
# steps and writes evidence/_report.json. Every check is deterministic: the
# attack is a recorded fixture, and the patch is proven by re-running the
# exploit against the candidate's own code. No server, no human grader.
# =============================================================================
board: board2
title: "Broken Object Level Authorization"
week: W01
day: D001
attack: { id: T1190, name: "Exploit Public-Facing Application" }
points: 100

target:
  app: lab/targets/web-api/app.py      # the file the candidate patches
  entry: ["python3", "{app}"]
  health: "/healthz"
  port: 8080

checks:

  - id: exploit-evidence
    kind: evidence_json
    weight: 25
    desc: "You ran the exploit and captured the leaked cross-tenant secret."
    path: evidence/W01/D001/board2.exploit.json
    expect:
      result: "EXPLOITED"
      leaked_secret: "QW-BOLA-PROOF-2001"

  - id: detection-fires
    kind: sigma_fires
    weight: 35
    desc: "Your Sigma rule flags the cross-tenant read in the captured log."
    rule: detections/sigma/board2-bola.yml
    events: fixtures/board2/access.log
    min_matches: 1
    # guard against a rule that just matches everything
    max_false_positives: 0
    benign_events: fixtures/board2/access-benign.log

  - id: patch-blocks-exploit
    kind: exploit_blocked
    weight: 40
    desc: "After your patch, the exploit can no longer read another tenant's order."
    harness: lab/attacker/toolbox/exploit_bola.py
    expect_exit: 3           # 3 == BLOCKED (403/401)

pass_threshold: 100          # all checks must pass; partial credit is reported
